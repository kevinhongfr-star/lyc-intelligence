<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Phase 17 / T01 — Default SEO meta (overridden per-page by <SEO /> component) -->
    <title>LYC Intelligence — Executive Intelligence Platform</title>
    <meta name="description" content="Know where you stand. Know where to go. Leadership intelligence for every stage — from career positioning to executive matching. 500+ placements across 47 markets." />

    <!-- Open Graph (default — landing page) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lyc-intelligence.app" />
    <meta property="og:title" content="LYC Intelligence — Executive Intelligence Platform" />
    <meta property="og:description" content="Know where you stand. Know where to go. Leadership intelligence for every stage — from career positioning to executive matching. 500+ placements across 47 markets." />
    <meta property="og:image" content="https://lyc-intelligence.app/api/og?title=LYC+Intelligence+%E2%80%94+Executive+Intelligence+Platform" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="LYC Intelligence" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LYC Intelligence — Executive Intelligence Platform" />
    <meta name="twitter:description" content="Know where you stand. Know where to go. Leadership intelligence for every stage." />
    <meta name="twitter:image" content="https://lyc-intelligence.app/api/og?title=LYC+Intelligence+%E2%80%94+Executive+Intelligence+Platform" />

    <!-- Canonical -->
    <link rel="canonical" href="https://lyc-intelligence.app" />

    <!-- #1273: All brand fonts self-hosted — zero CDN dependencies.
         Crimson Pro (headings), DM Sans (body), IBM Plex Mono (mono) —
         woff2 Latin subsets in /public/fonts/ with local @font-face in index.css.
         #1378: preload critical weights + preconnect third-party APIs. -->
    <link rel="preload" href="/fonts/CrimsonPro-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DMSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://api.deepseek.com" />
    <link rel="dns-prefetch" href="https://api.deepseek.com" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-bg-primary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
